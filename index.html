<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
<script>
/* Arranque sin parpadeo. Las páginas de la suite viven en el mismo dominio y
   comparten esta nota: si hay sesión abierta, se cubre la pantalla con la
   marca mientras Firebase la confirma, en lugar de mostrar un instante la
   pantalla de contraseña. Corre antes de dibujar nada.
   La nota se escribe al abrir sesión y se borra al cerrarla o si Firebase
   dice que ya no hay sesión. Si miente, la marca dura un momento y aparece
   la contraseña, que es lo correcto. */
(function(){
  try{
    if(localStorage.getItem('impredimex:sesion') === '1'){
      var h = document.documentElement;
      h.classList.add('con-sesion');
      // Red de seguridad: si en 8 s no terminó de abrir, se quita la marca y
      // queda a la vista lo que haya debajo. Nadie se queda sin salida.
      setTimeout(function(){ h.classList.remove('con-sesion'); }, 8000);
    }
  }catch(e){}
})();
function arranqueListo(haySesion){
  try{
    if(haySesion) localStorage.setItem('impredimex:sesion','1');
    else localStorage.removeItem('impredimex:sesion');
  }catch(e){}
  document.documentElement.classList.remove('con-sesion');
}
</script>
<style>
/* La marca se dibuja sobre la raíz, así no hace falta tocar el contenido de
   la página: cubre todo mientras dura la clase y desaparece al quitarla. */
html.con-sesion::after{
  content:'IMPREDIMEX'; position:fixed; inset:0; z-index:2147483647;
  display:flex; align-items:center; justify-content:center; background:#ffffff;
  font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:600; font-size:22px; letter-spacing:.20em; color:#002060;
}
</style>

    <link rel="icon" type="image/png" href="icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#003580" />
    <meta name="description" content="Directorio de personal, incidencias, capacitación y vacantes — IMPREDIMEX" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RRHH" />
    <!-- Jost, solo para el logotipo del encabezado (SPEC-035). Si no carga,
         el respaldo del sistema mantiene el mismo peso y espaciado: se ve
         distinta la letra, nunca se rompe el acomodo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600&display=swap" />
    <title>IMPREDIMEX — Recursos Humanos</title>
  </head>
  <body style="margin: 0; background-color: #f8fafc;">
    <div id="root">
      <!-- Lo que se ve mientras la aplicación carga, y lo que queda si no
           llega a cargar (SPEC-040). React reemplaza todo esto al arrancar; si
           nunca arranca —porque el archivo de la aplicación no se descargó—,
           a los 12 segundos aparece el aviso en lugar de una pantalla en
           blanco. Va escrito aquí y no en la aplicación a propósito: tiene que
           funcionar justamente cuando la aplicación no funciona. -->
      <div id="arranque-base" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;padding:1.5rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <div style="max-width:340px;text-align:center">
          <div style="font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;font-size:22px;letter-spacing:.20em;color:#002060">IMPREDIMEX</div>
          <div id="arranque-aviso" style="display:none;margin-top:1.4rem">
            <div style="font-size:15px;font-weight:700;color:#002060;margin-bottom:.5rem">No se pudo abrir la aplicación</div>
            <div style="font-size:12.5px;color:#5A6A80;line-height:1.6;margin-bottom:1.2rem">
              No terminó de descargarse. Suele ser la conexión: vuelve a intentarlo.
            </div>
            <button onclick="location.reload()" style="width:100%;min-height:46px;border-radius:9px;border:none;background:#003580;color:#fff;font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer">Reintentar</button>
            <div style="font-size:10.5px;color:#8A9AB0;margin-top:1rem;line-height:1.5">
              Se detuvo en: descargando la aplicación
            </div>
          </div>
        </div>
      </div>
      <script>
        setTimeout(function(){
          var a = document.getElementById('arranque-aviso');
          if (a) a.style.display = 'block';
          // Si la marca del arranque sigue encima, se quita: taparía el aviso.
          document.documentElement.classList.remove('con-sesion');
        }, 12000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
